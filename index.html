    <!-- Tailwind CSS -->

    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#003366", // Navy Blue
              accent: "#FFD700",  // Luxurious Golden Yellow
              "primary-light": "#004080", // Slightly lighter navy
              "background-light": "#F8FAFC",
              "background-dark": "#0F172A",
            },
            fontFamily: {
              display: ["Montserrat", "sans-serif"],
              body: ["Plus Jakarta Sans", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .font-display {
          font-family: 'Montserrat', sans-serif;
        }
        .blob-shape {
          border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
          overflow: hidden;
          box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .organic-shape {
             border-radius: 61% 39% 74% 26% / 46% 49% 51% 54%;
             overflow: hidden;
        }
        .hero-gradient {
            background: linear-gradient(135deg, #003366 0%, #004080 100%);
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .quote-card-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
        }
        .footer-curve {
            position: relative;
        }
        .footer-contact-card {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
      }
    </style>
